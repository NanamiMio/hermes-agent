name: Sync upstream main

# Keeps our main a superset of upstream main.
#
# Why main and not releases: an install whose checkout tracks this fork updates
# with `git pull` (the CLI's `hermes update`, and the desktop's in-app update
# which shells out to it). That pull is only a clean fast-forward while our main
# already contains upstream, so upstream's history is merged here — in CI, where
# a conflict is visible and fixable — rather than on a user's machine mid-update.
#
# This replaces the old release-gated pipeline (merge a release tag, cut a tag,
# create a release, bump the Homebrew tap). The official checkout install has no
# formula to bump: the CLI's `hermes update` and the installer's desktop rebuild
# are the update path now.
#
# NOTE: a fork repo cannot receive upstream's webhook, so polling is the only
# trigger; workflow_dispatch allows manual runs. Runs daily, no-op when upstream
# has not moved.

on:
  schedule:
    # 22:00 UTC = 06:00 in the maintainer's timezone, deliberately ahead of the
    # 09:00 local self-update job (which can only pull what this run has already
    # merged). The old 03:23 UTC slot sat *after* that job, so every local update
    # applied the previous day's merge.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # SYNC_TOKEN, not GITHUB_TOKEN: upstream edits .github/workflows/*, and
      # GitHub refuses a push that touches workflow files from a GitHub App
      # token (`workflows` is not in the GITHUB_TOKEN permissions table, so it
      # cannot be granted via `permissions:`). A fine-grained PAT with Contents:
      # read and write pushes workflow files without a Workflows grant.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream main
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream main --force
          git checkout main
          git reset --hard origin/main
          git config user.name "NanamiMio"
          git config user.email "zhangshower@gmail.com"
          behind=$(git rev-list --count "HEAD..upstream/main")
          if [ "$behind" = "0" ]; then
            echo "Already up to date with upstream main; nothing to merge."
            exit 0
          fi
          echo "upstream/main is ${behind} commit(s) ahead — merging."
          # A real merge, never --ff-only or a reset: main carries the fork's
          # commandcode-oauth patch set and must keep it.
          if git merge --no-edit upstream/main; then
            git push origin main
          else
            echo "::error::conflict merging upstream/main into main — resolve manually, then re-run"
            git merge --abort
            exit 1
          fi

      # The fork's whole reason to exist is the commandcode-oauth patch set. A
      # merge that silently drops part of it (an upstream refactor moving a call
      # site, a rename) would otherwise reach a user's install as a broken
      # provider, so fail loudly here instead.
      - name: Check the commandcode patch set survived
        run: |
          set -u
          fail=0
          for f in hermes_cli/auth_commandcode.py agent/commandcode_alpha_adapter.py; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          # file:marker — the exact string each patched file must still carry.
          # inventory.py holds the fork's disabled/excluded-provider filtering,
          # not commandcode wiring, so its marker is that change (asserting the
          # slug there failed the 2026-09-23 run on a false positive).
          while IFS=: read -r file marker; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || { echo "::error::missing $file"; fail=1; continue; }
            grep -q "$marker" "$file" || { echo "::error::$file no longer contains '$marker'"; fail=1; }
          done <<'EOF'
          hermes_cli/auth.py:commandcode-oauth
          hermes_cli/auth_commands.py:commandcode-oauth
          hermes_cli/runtime_provider.py:commandcode-oauth
          hermes_cli/models.py:commandcode-oauth
          hermes_cli/models_catalog_static.py:commandcode-oauth
          hermes_cli/model_setup_flows.py:commandcode-oauth
          hermes_cli/doctor_config.py:commandcode-oauth
          hermes_cli/inventory.py:is_provider_enabled
          agent/auxiliary_client.py:commandcode-oauth
          agent/chat_completion_helpers.py:commandcode-oauth
          plugins/model-providers/commandcode/__init__.py:commandcode-oauth
          EOF
          exit "$fail"

      - name: Compile the patched modules
        run: |
          python3 -m py_compile \
            hermes_cli/auth_commandcode.py \
            hermes_cli/auth.py \
            hermes_cli/runtime_provider.py \
            hermes_cli/models.py \
            hermes_cli/models_catalog_static.py \
            agent/commandcode_alpha_adapter.py \
            agent/auxiliary_client.py \
            agent/chat_completion_helpers.py
