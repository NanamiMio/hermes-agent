name: Sync upstream release

# Follows upstream *releases*, not upstream main.
#
# Upstream lands ~1,800 PRs a week; a machine tracking main pulls that firehose
# continuously, with no coherent changelog to show for it. A release tag is the
# batch worth carrying, so this merges the newest upstream release that our main
# does not already contain.
#
# main carries no in-tree patches: commandcode-oauth ships as an external
# model-provider plugin (NanamiMio/hermes-commandcode-oauth), so main is upstream
# plus fork-only CI/infra files and the merge has no patch set to protect.
#
# NOTE: a fork repo cannot receive upstream's webhook, so polling is the only
# trigger; workflow_dispatch allows manual runs. 22:00 UTC = 06:00 local.

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # SYNC_TOKEN, not GITHUB_TOKEN: upstream edits .github/workflows/*, and
      # GitHub refuses a push that touches workflow files from a GitHub App
      # token (`workflows` is not in the GITHUB_TOKEN permissions table).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge the newest upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git checkout main
          git reset --hard origin/main
          git config user.name "NanamiMio"
          git config user.email "zhangshower@gmail.com"

          # The release API, not `git tag | sort -V`: the fork carries its own
          # tags with the same shape (v2026.9.21.1, .2), which would sort newest
          # and are not upstream releases at all.
          latest=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
          [ -n "$latest" ] || { echo "::error::could not read the latest upstream release"; exit 1; }
          git fetch upstream "refs/tags/${latest}:refs/tags/${latest}" --force
          sha=$(git rev-list -n 1 "refs/tags/${latest}")

          if git merge-base --is-ancestor "$sha" HEAD; then
            echo "main already contains upstream release ${latest}; nothing to merge."
            exit 0
          fi
          echo "merging upstream release ${latest} (${sha})"
          if git merge --no-edit "$sha"; then
            git push origin main
          else
            echo "::error::conflict merging upstream release ${latest} — resolve manually, then re-run"
            git merge --abort
            exit 1
          fi
