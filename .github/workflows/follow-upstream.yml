name: Follow upstream

# Single pipeline that follows upstream releases end to end:
#   1. merge upstream main into our main (a real merge: our main carries local
#      commits, so neither --ff-only nor a reset to upstream is correct)
#   2. for each new upstream release tag: tag our main HEAD, create a
#      GitHub release, bump the homebrew tap formula
# Runs daily so a new upstream release is followed within ~24h.
# NOTE: fork repos cannot receive the upstream repo's `release` webhook,
# so polling is the only trigger. workflow_dispatch allows manual runs.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      # SYNC_TOKEN, not GITHUB_TOKEN: upstream edits .github/workflows/* (e.g. the
      # check_os_marker_fakes step in bf1c28b480), and GitHub refuses a push that
      # touches workflow files from a GitHub App token. `workflows` is not in the
      # GITHUB_TOKEN permissions table, so it cannot be granted via `permissions:`
      # — only a PAT with the workflow scope (or an App token that has it) works.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Sync main with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream main --tags --force
          git fetch origin main --tags --force
          git checkout main
          git reset --hard origin/main
          git config user.name "NanamiMio"
          git config user.email "zhangshower@gmail.com"
          # A real merge. --ff-only never succeeds once main has local commits
          # (it silently did nothing and left the sync to the fork auto-sync,
          # which hard-resets), and a reset to upstream deletes our work.
          if git merge --no-edit upstream/main; then
            git push origin main
            echo "main merged with upstream"
          else
            echo "::error::conflict merging upstream/main into main - resolve manually"
            git merge --abort
            exit 1
          fi
      - name: Tag, release and bump tap for new upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git checkout main
          git reset --hard origin/main
          git config user.name "NanamiMio"
          git config user.email "zhangshower@gmail.com"
          # Upstream tags look like v2026.9.11
          for tag in $(git ls-remote --tags upstream | awk '{print $2}' | sed 's|refs/tags/||;s|\^{}||' | grep -E '^v20[0-9]{2}\.' | sort -u); do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              continue
            fi
            upstream_sha=$(git rev-list -n 1 "refs/tags/$tag" 2>/dev/null || true)
            [ -z "$upstream_sha" ] && continue
            if ! git merge-base --is-ancestor "$upstream_sha" HEAD 2>/dev/null; then
              echo "SKIP $tag: upstream commit not yet merged into our main"
              continue
            fi
            echo "=== Following upstream release $tag (upstream commit $upstream_sha) ==="
            # A same-named upstream tag exists locally (fetched from upstream);
            # drop it so we can tag OUR head with the same name.
            git tag -d "$tag" 2>/dev/null || true
            git tag -a "$tag" HEAD -m "Follow upstream release $tag (upstream commit $upstream_sha) + commandcode-oauth"
            git push origin "refs/tags/$tag" --force
            # NOTE: GITHUB_TOKEN in a fork cannot read the upstream repo's
            # releases API (403), so title is built from the tag only.
            # --repo is required: with multiple remotes gh can resolve the
            # wrong repo (verified in sandbox).
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Hermes Agent ($tag) + commandcode-oauth" \
              --notes "Follows upstream release [$tag](https://github.com/NousResearch/hermes-agent/releases/tag/$tag) (upstream commit \`$upstream_sha\`), plus the commandcode-oauth provider (Go-tier CLI credentials). Install via the homebrew tap." \
              || true
            # --- bump tap formula (python: no shell/perl quoting pitfalls) ---
            curl -sL -o hermes.tar.gz "https://github.com/NanamiMio/hermes-agent/archive/refs/tags/${tag}.tar.gz"
            SHA=$(shasum -a 256 hermes.tar.gz | awk '{print $1}')
            REV_SHA=$(gh api "repos/NanamiMio/hermes-agent/git/refs/tags/${tag}" --jq '.object.sha')
            REV_SHA=$(gh api "repos/NanamiMio/hermes-agent/git/tags/${REV_SHA}" --jq '.object.sha')
            [ -z "$REV_SHA" ] && REV_SHA=$(gh api "repos/NanamiMio/hermes-agent/git/refs/tags/${tag}" --jq '.object.sha')
            rm -rf tap-repo && git clone "https://x-access-token:${TAP_TOKEN}@github.com/NanamiMio/homebrew-tap.git" tap-repo
            TAG="$tag" SHA="$SHA" REV_SHA="$REV_SHA" OWNER_REPO="NanamiMio/hermes-agent" FORMULA_PATH="Formula/hermes-agent.rb" python3 .github/scripts/bump-formula.py
            (
              cd tap-repo
              git config user.name "NanamiMio"
              git config user.email "zhangshower@gmail.com"
              git add Formula/hermes-agent.rb
              git commit -m "chore: bump hermes-agent to ${tag}" || exit 0
              git push origin master
            )
            rm -rf tap-repo hermes.tar.gz
          done
