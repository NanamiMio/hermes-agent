name: Follow upstream

# Single pipeline that follows upstream releases end to end, gated on a release:
#   1. detect: does upstream have a release tag we have not followed yet?
#      No -> stop here. Nothing is merged, pushed or published.
#   2. merge that release's commit into our main (a real merge: our main carries
#      local commits, so neither --ff-only nor a reset to upstream is correct)
#   3. tag our main HEAD with the same tag, create a GitHub release, bump the
#      homebrew tap formula
# The fork tracks upstream *releases*, not upstream main: commits upstream lands
# after a release wait for the next one. Runs daily so a release is followed
# within ~24h, but the run is a no-op unless upstream has actually released.
# NOTE: fork repos cannot receive the upstream repo's `release` webhook,
# so polling is the only trigger. workflow_dispatch allows manual runs.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      # SYNC_TOKEN, not GITHUB_TOKEN: upstream edits .github/workflows/* (e.g. the
      # check_os_marker_fakes step in bf1c28b480), and GitHub refuses a push that
      # touches workflow files from a GitHub App token. `workflows` is not in the
      # GITHUB_TOKEN permissions table, so it cannot be granted via `permissions:`.
      # A fine-grained PAT carrying Contents: read and write does push workflow
      # files (verified 2026-09-17, run 35198715227) — no Workflows grant needed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Detect new upstream releases
        id: detect
        run: |
          # Release gate. The daily schedule is only a poll (a fork cannot receive
          # upstream's release webhook); on a day without a new release this job
          # exits without merging, pushing or publishing anything.
          # One ls-remote per remote, compared locally: an ls-remote per tag made
          # the daily run needlessly slow.
          origin_tags=$(git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||;s|\^{}||' | sort -u)
          pending=""
          for tag in $(git ls-remote --tags upstream | awk '{print $2}' | sed 's|refs/tags/||;s|\^{}||' | grep -E '^v20[0-9]{2}\.' | sort -uV); do
            if printf '%s\n' "$origin_tags" | grep -qx "$tag"; then
              continue
            fi
            pending="$pending $tag"
          done
          pending="${pending# }"
          latest=""
          for tag in $pending; do latest="$tag"; done
          {
            echo "pending=$pending"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$pending" ]; then
            echo "No new upstream release; nothing to sync."
          else
            echo "New upstream release(s):${pending} (newest: ${latest})"
          fi
      - name: Sync main with upstream release
        if: steps.detect.outputs.pending != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream main --tags --force
          git fetch origin main --tags --force
          git checkout main
          git reset --hard origin/main
          git config user.name "NanamiMio"
          git config user.email "zhangshower@gmail.com"
          # Merge the released commit itself, not upstream/main: the newest pending
          # release contains the older ones, so they all become ancestors of HEAD.
          upstream_sha=$(git rev-list -n 1 "refs/tags/${LATEST}")
          echo "Merging upstream release ${LATEST} (${upstream_sha})"
          # A real merge. --ff-only never succeeds once main has local commits
          # (it silently did nothing and left the sync to the fork auto-sync,
          # which hard-resets), and a reset to upstream deletes our work.
          if git merge --no-edit "$upstream_sha"; then
            git push origin main
            echo "main merged with upstream release ${LATEST}"
          else
            echo "::error::conflict merging upstream release ${LATEST} into main - resolve manually"
            git merge --abort
            exit 1
          fi
      - name: Tag, release and bump tap for new upstream releases
        if: steps.detect.outputs.pending != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git checkout main
          git reset --hard origin/main
          git config user.name "NanamiMio"
          git config user.email "zhangshower@gmail.com"
          # Upstream tags look like v2026.9.11
          for tag in $(git ls-remote --tags upstream | awk '{print $2}' | sed 's|refs/tags/||;s|\^{}||' | grep -E '^v20[0-9]{2}\.' | sort -u); do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              continue
            fi
            upstream_sha=$(git rev-list -n 1 "refs/tags/$tag" 2>/dev/null || true)
            [ -z "$upstream_sha" ] && continue
            if ! git merge-base --is-ancestor "$upstream_sha" HEAD 2>/dev/null; then
              echo "SKIP $tag: upstream commit not yet merged into our main"
              continue
            fi
            echo "=== Following upstream release $tag (upstream commit $upstream_sha) ==="
            # A same-named upstream tag exists locally (fetched from upstream);
            # drop it so we can tag OUR head with the same name.
            git tag -d "$tag" 2>/dev/null || true
            git tag -a "$tag" HEAD -m "Follow upstream release $tag (upstream commit $upstream_sha) + commandcode-oauth"
            git push origin "refs/tags/$tag" --force
            # NOTE: GITHUB_TOKEN in a fork cannot read the upstream repo's
            # releases API (403), so title is built from the tag only.
            # --repo is required: with multiple remotes gh can resolve the
            # wrong repo (verified in sandbox).
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Hermes Agent ($tag) + commandcode-oauth" \
              --notes "Follows upstream release [$tag](https://github.com/NousResearch/hermes-agent/releases/tag/$tag) (upstream commit \`$upstream_sha\`), plus the commandcode-oauth provider (Go-tier CLI credentials). Install via the homebrew tap." \
              || true
            # --- bump tap formula (python: no shell/perl quoting pitfalls) ---
            curl -sL -o hermes.tar.gz "https://github.com/NanamiMio/hermes-agent/archive/refs/tags/${tag}.tar.gz"
            SHA=$(shasum -a 256 hermes.tar.gz | awk '{print $1}')
            REV_SHA=$(gh api "repos/NanamiMio/hermes-agent/git/refs/tags/${tag}" --jq '.object.sha')
            REV_SHA=$(gh api "repos/NanamiMio/hermes-agent/git/tags/${REV_SHA}" --jq '.object.sha')
            [ -z "$REV_SHA" ] && REV_SHA=$(gh api "repos/NanamiMio/hermes-agent/git/refs/tags/${tag}" --jq '.object.sha')
            rm -rf tap-repo && git clone "https://x-access-token:${TAP_TOKEN}@github.com/NanamiMio/homebrew-tap.git" tap-repo
            TAG="$tag" SHA="$SHA" REV_SHA="$REV_SHA" OWNER_REPO="NanamiMio/hermes-agent" FORMULA_PATH="Formula/hermes-agent.rb" python3 .github/scripts/bump-formula.py
            (
              cd tap-repo
              git config user.name "NanamiMio"
              git config user.email "zhangshower@gmail.com"
              git add Formula/hermes-agent.rb
              git commit -m "chore: bump hermes-agent to ${tag}" || exit 0
              git push origin master
            )
            rm -rf tap-repo hermes.tar.gz
          done
